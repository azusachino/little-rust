[package]
name = "rust_practice"
version = "0.1.1"
authors = ["azusachino <azusachino@duck.com>"]
edition = "2021"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/azusachino/little-rust"
build = "build.rs"

[[bin]]
name = "routeguide-server"
path = "src/grpc/routeguide/server.rs"
required-features = ["routeguide"]

[[bin]]
name = "routeguide-client"
path = "src/grpc/routeguide/client.rs"
required-features = ["routeguide"]


[dependencies]
anyhow = "1"
thiserror = "2"

# web server
axum = "0.8"
mio = "1.0"

# image
image = "0.25"

# utils
lru = "0.16"
percent-encoding = "2"
slab = "0.4"

# photo process
photon-rs = "0.3"

bytes = "1.6"
base64 = "0.22"
byteorder = "1.5"

# hasher
blake3 = "1.5"

chrono = { version = "0.4.33", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossterm = "0.29"
dashmap = "6.0"
futures = "0.3"
futures-util = "0.3"
hyper = { version = "1", features = ["full"] }
itertools = "0.14"
rand = { version = "0.9", default-features = false }
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-stream = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }
once_cell = "1.19"
reqwest = { version = "0.12", features = ["json"] }
html2md = "0.2"
regex = "1.10"
walkdir = "2.5"
glob = "0.3"
csv = "1.3"
toml = "0.9"
bitflags = "2.5"
log = "0.4"
rayon = "1.10"

dotenv = "0.15"

# telemetry
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["tonic"] }
opentelemetry-semantic-conventions = "0.30"

# tower
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }

# prost
prost = "0.14"
prost-derive = "0.14"
prost-types = "0.14"

# logging
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.31"

# dal
opendal = { version = "0.53", features = ["services-s3"] }

[target.'cfg(unix)'.dependencies]
openssl = "0.10"

[build-dependencies]
prost-build = "0.14"
tonic-build = "0.13"

[features]
routeguide = ["dep:async-stream", "tokio-stream"]
